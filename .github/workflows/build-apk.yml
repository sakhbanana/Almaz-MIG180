name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests (tachometer core)
        run: |
          chmod +x gradlew
          ./gradlew :tacho:testReleaseUnitTest --no-daemon

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MIG180-WireSpeed.apk
          cp tacho/build/outputs/apk/release/tacho-release.apk MIG180-Tacho.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MIG180-apk
          path: |
            MIG180-WireSpeed.apk
            MIG180-Tacho.apk

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tacho-test-report
          path: tacho/build/reports/tests/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MIG180-WireSpeed.apk MIG180-Tacho.apk \
            --target "${{ github.sha }}" \
            --title "MIG180 $TAG" \
            --notes "MIG180-WireSpeed.apk — калькулятор подачи по заводской таблице.
          MIG180-Tacho.apk — оптический тахометр: измеряет реальную скорость подачи камерой по метке на подающем ролике.
          Скачайте нужный APK и установите на телефон."

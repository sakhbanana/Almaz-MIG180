plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almaz.mig180.wirespeed'
    compileSdk 34

    defaultConfig {
        applicationId "com.almaz.mig180.wirespeed"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword "almaz180"
            keyAlias "almaz"
            keyPassword "almaz180"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
